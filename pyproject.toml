[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dts-mcp-server"
version = "0.1.0"
description = "MCP server and CLI for DTS Engine (飞渡科技 / Freedo) 3D tile publishing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "gis", "3d-tiles", "digital-twin", "dts", "freedo"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "aiosqlite>=0.21,<1",
  "click>=8.0",
  "cryptography>=45",
  "mcp>=2.0",
  "prompt_toolkit>=3.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "starlette>=0.46",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# Only needed to generate fixtures for the E2E tier.
test-fixtures = [
  "geopandas>=0.14",
  "rasterio>=1.3",
  "numpy>=1.24",
  "shapely>=2.0",
]

[project.scripts]
dts-mcp-server = "dts_mcp_server.__main__:main"
cli-anything-dts-engine = "cli_anything.dts_engine.dts_engine_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dts_mcp_server", "src/cli_anything"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and the tests using them must share one event loop, or anyio task
# groups inside the ASGI lifespan are exited from a different task than they were
# entered in.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# repl_skin.py is vendored verbatim from the cli-anything plugin; keeping it
# unmodified makes it easy to re-sync upstream.
extend-exclude = ["src/cli_anything/dts_engine/utils/repl_skin.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
